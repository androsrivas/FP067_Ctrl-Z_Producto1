<div class="d-flex align-items-center justify-content-between gap-3 mb-4">
    <div class="search-container flex-grow-1">
        <app-input placeholder="Buscar jugador..." (valueChange)="searchChange.emit($event)">
        </app-input>
    </div>

    <div class="d-flex align-items-center gap-2">
        <label for="sort-select" class="text-body-secondary small mb-0">Ordenar:</label>
        <select  id="sort-select" class="form-select w-auto" (change)="onSortSelect($event)">
            <option value="position">Por posición</option>
            <option value="name">Por nombre</option>
            <option value="age">Por edad</option>
        </select>
    </div>
</div>

<div *ngIf="player; else noPlayer" class="player-card gap-3">

    <!-- Capçalera -->
    <div class="d-flex align-items-start gap-3">
        <div class="avatar flex-shrink-0 rounded-3 overflow-hidden">
            <img *ngIf="player.foto" [src]="player.foto" [alt]="player.nombre + ' ' + player.apellidos"
                class="w-100 h-100 object-fit-cover">
        </div>

        <div class="flex-grow-1">
            <small class="text-body-secondary text-uppercase">
                Dorsal {{ player.dorsal < 10 ? '0' + player.dorsal : player.dorsal }} </small>
                    <h2 class="card-title fs-4 mb-1">{{ player.nombre }} {{ player.apellidos }}</h2>
                    <p class="card-position small mb-0">{{ player.posicion }} · Primer equipo</p>
        </div>

        <button type="button" class="btn-close" aria-label="Cerrar detalle" (click)="close()"></button>
    </div>

    <!-- Info personal -->
    <div class="row row-cols-3 g-0 border-top border-bottom py-3">
        <div class="col" *ngFor="let item of personalInfo">
            <div class="card-details small">{{ item.label }}</div>
            <div class="fw-semibold">{{ item.value }}</div>
        </div>
    </div>

    <!-- Promedios -->
    <div class="d-flex justify-content-between align-items-center">
        <span class="fw-semibold">Promedios por partido</span>
        <span class="text-sorting">2026 / 2027</span>
    </div>

    <div class="row row-cols-3 g-2 text-center">
        <div class="col">
            <div class="border rounded-3 p-3">
                <app-stat-card [value]="player.puntos" label="Puntos"></app-stat-card>
            </div>
        </div>
        <div class="col">
            <div class="border rounded-3 p-3">
                <app-stat-card [value]="player.asistencias" label="Asistencias"></app-stat-card>
            </div>
        </div>
        <div class="col">
            <div class="border rounded-3 p-3">
                <app-stat-card [value]="player.rebotes" label="Rebotes"></app-stat-card>
            </div>
        </div>
    </div>

    <p *ngIf="player.biografia" class="card-details mb-0">{{ player.biografia }}</p>
</div>

<ng-template #noPlayer>
    <div class="player-card card-details text-center">
        Selecciona un jugador para ver los detalles.
    </div>
</ng-template>
